<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>风格拆解</title><link rel="stylesheet" href="styles.css">
<style>
body { padding: 18px 16px 24px; }
header { margin-bottom: 18px; }
.brand { font-size: 17px; font-weight: 600; }
.hero { text-align: center; padding: 26px 18px; }
.hero .icon { font-size: 28px; margin-bottom: 6px; }
.current .thumb { height: 150px; margin: -20px -22px 16px; border-radius: var(--r) var(--r) 0 0; }
.section + .section { margin-top: 18px; }
.recent { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-radius: 10px; cursor: pointer; }
.recent:hover { background: var(--surface); }
.recent .thumb { width: 44px; height: 44px; flex: none; }
.recent .t { flex: 1; min-width: 0; }
.recent .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { height: 4px; background: var(--sunk); border-radius: 4px; overflow: hidden; margin-top: 10px; }
.progress span { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 4px; animation: slide 1.4s infinite ease-in-out; }
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
</style></head>
<body>
  <header class="spread">
    <div class="brand">风格拆解</div>
    <div class="row" style="gap:2px">
      <button class="ghost small" id="home">审美库主页</button>
      <button class="ghost small" id="opt">设置</button>
    </div>
  </header>
  <main id="app"></main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
